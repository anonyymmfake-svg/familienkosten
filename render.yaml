services:
  - type: web
    name: familienkosten-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: MONGODB_URI
        sync: false
      - key: FAMILY_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: familienkosten
      - key: ALLOWED_ORIGIN
        value: https://anonyymmfake-svg.github.io
